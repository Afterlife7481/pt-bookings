name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  APP_ENV: local
  TEST_DATABASE_URL: postgresql://pt:pt@localhost:5432/pt_bookings_test
  DATABASE_URL: postgresql://pt:pt@localhost:5432/pt_bookings_test

jobs:
  lint-and-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pt
          POSTGRES_PASSWORD: pt
          POSTGRES_DB: pt_bookings_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pt -d pt_bookings_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit / integration tests
        run: npm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pt
          POSTGRES_PASSWORD: pt
          POSTGRES_DB: pt_bookings_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pt -d pt_bookings_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
